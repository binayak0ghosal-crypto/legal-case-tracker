<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Case Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .controls { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #2c3e50; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #1a252f; }
        .lang-btn { width: auto; background-color: #27ae60; }
        .logout-btn { width: auto; background-color: #7f8c8d; }
        .search-box { margin: 15px 0; border: 2px solid #2c3e50; background-color: #fcfcfc; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        .completed { background-color: #d5f5e3; }
        .action-btn { width: auto; padding: 5px 10px; font-size: 12px; margin-right: 5px; }
        .delete-btn { background-color: #e74c3c; }
        
        #authScreen { text-align: center; padding: 5px; }
        .login-btn { background-color: #4285F4; font-size: 16px; padding: 15px; width: auto; margin-top: 20px;}
        #appScreen { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="authScreen">
        <h2 id="loginTitle">Legal Case Tracker</h2>
        <p>Please sign in with your Google Account to manage your cases securely.</p>
        <button class="login-btn" id="loginBtn">🔵 Sign In With Google</button>
    </div>

    <div id="appScreen">
        <div class="controls">
            <h2 id="titleText">Legal Case Tracker</h2>
            <div>
                <button class="lang-btn" id="langToggle">বাংলায় দেখুন</button>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </div>

        <div>
            <input type="text" id="lawyerName" placeholder="Lawyer Name" required>
            <input type="text" id="contactInfo" placeholder="Contact ID / Phone" required>
            <input type="text" id="caseName" placeholder="Case Details" required>
            <button id="addBtn">Add Record</button>
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        <input type="text" id="searchBar" class="search-box" placeholder="Search by lawyer name...">

        <table>
            <thead>
                <tr>
                    <th id="thLawyer">Lawyer</th>
                    <th id="thContact">Contact</th>
                    <th id="thCase">Case</th>
                    <th id="thStatus">Status</th>
                    <th id="thActions">Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, doc, setDoc, query, onSnapshot, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "YOUR_FIREBASE_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID",
        measurementId: "YOUR_MEASUREMENT_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let records = [];
    let currentLang = 'en';

    const translations = {
        en: {
            titleText: "Legal Case Tracker", langToggle: "বাংলায় দেখুন", lawyerName: "Lawyer Name",
            contactInfo: "Contact ID / Phone", caseName: "Case Details", addBtn: "Add Record",
            searchBar: "🔍 Search by lawyer name...", thLawyer: "Lawyer", thContact: "Contact",
            thCase: "Case", thStatus: "Status", thActions: "Actions", statusActive: "Active",
            statusDone: "Completed", btnComplete: "Finish Case", btnDelete: "Remove"
        },
        bn: {
            titleText: "আইনি মামলা ট্র্যাকার", langToggle: "View in English", lawyerName: "আইনজীবীর নাম",
            contactInfo: "যোগাযোগের নম্বর", caseName: "মামলার বিবরণ", addBtn: "রেকর্ড যোগ করুন",
            searchBar: "🔍 আইনজীবীর নাম দিয়ে খুঁজুন...", thLawyer: "আইনজীবী", thContact: "যোগাযোগ",
            thCase: "মামলা", thStatus: "অবস্থা", thActions: "পদক্ষেপ", statusActive: "চলমান",
            statusDone: "সম্পন্ন", btnComplete: "সম্পন্ন করুন", btnDelete: "মুছে ফেলুন"
        }
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
            
            await setDoc(doc(db, "registered_users", user.uid), {
                name: user.displayName,
                email: user.email,
                lastLogin: new Date()
            }, { merge: true });

            loadData();
        } else {
            currentUser = null;
            document.getElementById('authScreen').style.display = 'block';
            document.getElementById('appScreen').style.display = 'none';
        }
    });

    document.getElementById('loginBtn').addEventListener('click', () => {
        signInWithPopup(auth, provider).catch(err => console.error("Login encountered an issue:", err.message));
    });

    document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

    function loadData() {
        const q = query(collection(db, "users", currentUser.uid, "cases"));
        onSnapshot(q, (snapshot) => {
            records = [];
            snapshot.forEach((doc) => {
                records.push({ id: doc.id, ...doc.data() });
            });
            renderTable();
        });
    }

    document.getElementById('addBtn').addEventListener('click', async () => {
        const nameField = document.getElementById('lawyerName');
        const contactField = document.getElementById('contactInfo');
        const caseField = document.getElementById('caseName');

        if (!nameField.value || !contactField.value || !caseField.value) {
            alert("Please fill out all required fields.");
            return;
        }

        await addDoc(collection(db, "users", currentUser.uid, "cases"), {
            name: nameField.value, 
            contact: contactField.value, 
            caseDetails: caseField.value, 
            completed: false, 
            createdAt: new Date()
        });

        nameField.value = '';
        contactField.value = '';
        caseField.value = '';
    });

    window.toggleStatus = async (id, currentStatus) => {
        const docRef = doc(db, "users", currentUser.uid, "cases", id);
        await updateDoc(docRef, { completed: !currentStatus });
    };

    window.deleteRecord = async (id) => {
        if (confirm("Are you sure you want to delete this case configuration?")) {
            const docRef = doc(db, "users", currentUser.uid, "cases", id);
            await deleteDoc(docRef);
        }
    };

    document.getElementById('searchBar').addEventListener('input', renderTable);
    
    document.getElementById('langToggle').addEventListener('click', () => {
        currentLang = currentLang === 'en' ? 'bn' : 'en';
        applyLanguage();
        renderTable();
    });

    function applyLanguage() {
        const t = translations[currentLang];
        document.getElementById('titleText').innerText = t.titleText;
        document.getElementById('langToggle').innerText = t.langToggle;
        document.getElementById('lawyerName').placeholder = t.lawyerName;
        document.getElementById('contactInfo').placeholder = t.contactInfo;
        document.getElementById('caseName').placeholder = t.caseName;
        document.getElementById('searchBar').placeholder = t.searchBar;
        document.getElementById('addBtn').innerText = t.addBtn;
        document.getElementById('thLawyer').innerText = t.thLawyer;
        document.getElementById('thContact').innerText = t.thContact;
        document.getElementById('thCase').innerText = t.thCase;
        document.getElementById('thStatus').innerText = t.thStatus;
        document.getElementById('thActions').innerText = t.thActions;
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        const t = translations[currentLang];
        const queryStr = document.getElementById('searchBar').value.toLowerCase();

        records.filter(r => r.name.toLowerCase().includes(queryStr)).forEach(record => {
            const tr = document.createElement('tr');
            if (record.completed) tr.className = 'completed';
            tr.innerHTML = `
                <td>${record.name}</td>
                <td>${record.contact}</td>
                <td>${record.caseDetails}</td>
                <td>${record.completed ? t.statusDone : t.statusActive}</td>
                <td>
                    <button class="action-btn" onclick="toggleStatus('${record.id}', ${record.completed})">${t.btnComplete}</button>
                    <button class="action-btn delete-btn" onclick="deleteRecord('${record.id}')">${t.btnDelete}</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }
    
    applyLanguage();
</script>
</body>
</html>
